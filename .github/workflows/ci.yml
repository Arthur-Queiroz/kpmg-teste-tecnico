name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write # o job de release publica a imagem no GHCR

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Postgres dedicado aos testes e2e — espelha o banco kpmg_teste_test do
      # docker-compose local (ver docs/07-TESTING-STRATEGY.md e
      # apps/api/.env.test).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kpmg_teste_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # MongoDB dos testes e2e do audit log (apps/api/.env.test aponta para
      # localhost:27017 — mesmas credenciais do compose local).
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: kpmg
          MONGO_INITDB_ROOT_PASSWORD: kpmg
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/api consome @kpmg/shared via dist/ — precisa do build antes de
      # testar/buildar a API (ver TASKS.md e docs/09-DECISIONS.md).
      - name: Build shared package
        run: pnpm --filter @kpmg/shared build

      # O postinstall do @prisma/client não roda (pnpm só permite scripts de
      # build allowlistados), então o client precisa ser gerado explicitamente.
      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: |
          pnpm --filter api lint
          pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter api typecheck

      - name: Unit tests
        run: |
          pnpm --filter @kpmg/shared test
          pnpm --filter api test

      - name: Apply migrations to the test database
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/kpmg_teste_test

      - name: E2E tests (CRUD + no-auth proof)
        run: pnpm --filter api test:e2e

      - name: Build
        run: |
          pnpm --filter api build
          pnpm --filter web build

  # Deploy na VPS (modelo vps-infra): build+push da imagem no GHCR por digest
  # e release via chave SSH confinada. Só roda na main com DEPLOY_ENABLED=true
  # (ver docs/08-DEPLOYMENT.md).
  release:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    uses: Arthur-Queiroz/vps-deploy/.github/workflows/app-deploy.yml@main
    with:
      app-id: kpmg
      service: api
      image-repo: arthur-queiroz/kpmg-teste-tecnico
      context: .
      dockerfile: apps/api/Dockerfile
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}

  # Verificação pós-deploy contra o domínio real. O release já espera o
  # healthcheck do container passar, mas isso prova o caminho inteiro —
  # Cloudflare Tunnel, Caddy, Postgres e Mongo — do lado de fora.
  smoke:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test em produção
        env:
          BASE_URL: https://kpmg.devarthur.com.br
        run: |
          set -euo pipefail

          # O swap já aconteceu, mas a borda pode levar alguns segundos para
          # apontar para o container novo.
          status=000
          for attempt in $(seq 1 10); do
            status=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE_URL/health" || echo 000)
            [ "$status" = "200" ] && break
            echo "tentativa $attempt: /health respondeu $status"
            sleep 6
          done
          if [ "$status" != "200" ]; then
            echo "::error::/health não respondeu 200 (último: $status)"
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/health.json || {
            echo "::error::/health respondeu 200 mas sem status ok"; cat /tmp/health.json; exit 1; }

          # CRUD no ar: envelope de paginação vindo do Postgres.
          status=$(curl -sS -o /tmp/companies.json -w '%{http_code}' "$BASE_URL/companies?pageSize=1")
          if [ "$status" != "200" ]; then
            echo "::error::/companies respondeu $status"; cat /tmp/companies.json; exit 1
          fi
          grep -q '"total"' /tmp/companies.json || {
            echo "::error::/companies sem envelope de paginação"; cat /tmp/companies.json; exit 1; }

          # 200 aqui só é possível com o Mongo conectado: sem ele o
          # AuditLogService devolve 503 (audit-log.service.ts).
          status=$(curl -sS -o /tmp/audit.json -w '%{http_code}' "$BASE_URL/audit-logs?pageSize=1")
          if [ "$status" != "200" ]; then
            echo "::error::/audit-logs respondeu $status — MongoDB provavelmente fora do ar"
            cat /tmp/audit.json 2>/dev/null || true
            exit 1
          fi

          echo "smoke ok: health, companies e audit-logs respondendo em produção"
